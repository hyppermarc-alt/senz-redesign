<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0a0a0b">
<title>SENZ · Design Preview</title>
<link rel="icon" href="assets/img/favicon.png">
<style>
:root{--bg:#0a0a0b;--text:#f3f1ee;--muted:#9b9ba1;--red:#d72b3f;--line:rgba(255,255,255,.16);--ease:cubic-bezier(.22,1,.36,1);--io:cubic-bezier(.76,0,.24,1)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
.g{position:relative;height:100%;display:grid;place-items:center;padding:24px;isolation:isolate;overflow:hidden;overflow:clip}
.glow{position:absolute;left:50%;top:58%;width:120vw;height:60vh;transform:translate(-50%,-50%);background:radial-gradient(50% 50% at 50% 50%,rgba(215,43,63,.22),transparent 70%);z-index:-2;filter:blur(20px)}
.persp{position:absolute;inset:0;perspective:340px;perspective-origin:50% 42%;z-index:-1;overflow:hidden;overflow:clip;-webkit-mask-image:linear-gradient(to top,#000 20%,transparent 62%);mask-image:linear-gradient(to top,#000 20%,transparent 62%)}
.road{position:absolute;left:50%;bottom:-40vh;width:110vw;min-width:900px;height:240vh;transform:translateX(-50%) rotateX(78deg);transform-origin:50% 100%;
  background:repeating-linear-gradient(to bottom,rgba(255,255,255,.05) 0 2px,transparent 2px 120px),linear-gradient(90deg,transparent 18%,rgba(255,255,255,.035) 18%,rgba(255,255,255,.035) 82%,transparent 82%);
  animation:move 1.1s linear infinite}
.road::before,.road::after{content:"";position:absolute;top:0;bottom:0;width:4px;background:rgba(243,241,238,.55)}
.road::before{left:18%}.road::after{right:18%}
.lane{position:absolute;top:0;bottom:0;left:50%;width:8px;margin-left:-4px;background:repeating-linear-gradient(to bottom,var(--red) 0 70px,transparent 70px 120px);animation:move 1.1s linear infinite;box-shadow:0 0 30px rgba(215,43,63,.4)}
@keyframes move{to{background-position:0 120px}}
.box{width:min(420px,100%);text-align:center;opacity:0;transform:translateY(16px);transition:opacity .9s var(--ease),transform .9s var(--ease)}
.ready .box{opacity:1;transform:none}
.logo{width:180px;height:auto;margin:0 auto 34px;display:block}
.eyebrow{display:inline-flex;align-items:center;gap:10px;margin:0;font:500 11px/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.eyebrow i{width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:0 0 0 0 rgba(215,43,63,.6);animation:ping 1.8s infinite}
@keyframes ping{80%,100%{box-shadow:0 0 0 9px rgba(215,43,63,0)}}
h1{margin:16px 0 8px;font-size:clamp(30px,6vw,40px);font-weight:800;letter-spacing:-.03em;line-height:1.05}
.sub{margin:0 0 30px;color:var(--muted);font-size:15.5px}
.field{position:relative;display:flex;align-items:center;height:62px;padding:0 7px 0 24px;border:1px solid var(--line);border-radius:999px;background:rgba(18,18,20,.72);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);transition:border-color .3s,box-shadow .3s}
.field:focus-within{border-color:rgba(243,241,238,.5);box-shadow:0 0 0 6px rgba(215,43,63,.12)}
.field input{flex:1;min-width:0;height:100%;background:none;border:0;outline:0;color:var(--text);font:inherit;font-size:17px;letter-spacing:.06em}
.field input::placeholder{color:#6f6f75;letter-spacing:0}
.field button{position:relative;width:48px;height:48px;border:0;border-radius:50%;background:var(--red);color:#fff;cursor:pointer;display:grid;place-items:center;transition:transform .5s var(--ease),background .3s}
.field button:hover{transform:scale(1.06)}
.field button:focus-visible{outline:2px solid #fff;outline-offset:3px}
.field svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:opacity .2s,transform .4s var(--ease)}
.field .spin,.field .ok{position:absolute;opacity:0}
.busy .field .arr{opacity:0}
.busy .field .spin{opacity:1;animation:rot .8s linear infinite}
.done .field .arr,.done .field .spin{opacity:0}
.done .field .ok{opacity:1}
.done .field{border-color:rgba(94,224,143,.6)}
.done .field button{background:#2fb36b}
@keyframes rot{to{transform:rotate(360deg)}}
.bad .field{border-color:var(--red);animation:shake .5s var(--ease)}
@keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.err{min-height:22px;margin:16px 0 0;color:#ff8a95;font-size:14px}
.foot{position:absolute;left:0;right:0;bottom:22px;text-align:center;margin:0;font:500 10.5px ui-monospace,Menlo,monospace;letter-spacing:.14em;text-transform:uppercase;color:#5d5d63}
.wipe{position:fixed;inset:0;z-index:10;pointer-events:none;clip-path:inset(100% 0 0 0);transition:clip-path .75s var(--io)}
.wipe.r{background:var(--red)}
.wipe.k{background:var(--bg);transition-delay:.14s}
.out .wipe{clip-path:inset(0)}
@media (prefers-reduced-motion:reduce){.road,.lane{animation:none}.wipe{transition:none}}
</style>
</head>
<body>
<main class="g">
  <div class="glow"></div>
  <div class="persp" aria-hidden="true"><div class="road"><div class="lane"></div></div></div>
  <form class="box" id="f" autocomplete="off">
    <img class="logo" src="assets/img/logo-white.png" alt="SENZ">
    <p class="eyebrow"><i></i>Design Preview · Geschützt</p>
    <h1>Willkommen an Bord.</h1>
    <p class="sub">Dieser Entwurf ist passwortgeschützt.</p>
    <div class="field">
      <input id="pw" type="password" placeholder="Passwort eingeben" aria-label="Passwort" autocomplete="current-password" autofocus>
      <button type="submit" aria-label="Entsperren">
        <svg class="arr" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        <svg class="spin" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9"/></svg>
        <svg class="ok" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>
      </button>
    </div>
    <p class="err" id="err" role="alert" aria-live="polite"></p>
  </form>
  <p class="foot">Redesign-Entwurf · SENZ Gruppe Düsseldorf</p>
</main>

  const KEY = 'senz-preview';
  const f = document.getElementById('f'), pw = document.getElementById('pw'), err = document.getElementById('err');
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const wait = ms => new Promise(r => setTimeout(r, ms));

  async function decrypt(pass) {
    const enc = new TextEncoder();
    const base = await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveBits']);
    const bits = new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: b64(P.s), iterations: P.it, hash: 'SHA-256' }, base, 512));
    const iv = b64(P.iv), ct = b64(P.ct), signed = new Uint8Array(iv.length + ct.length);
    signed.set(iv); signed.set(ct, iv.length);
    const mk = await crypto.subtle.importKey('raw', bits.slice(32), { name: 'HMAC', hash: 'SHA-256' }, false, ['verify']);
    if (!await crypto.subtle.verify('HMAC', mk, b64(P.mac), signed)) return null;
    const ek = await crypto.subtle.importKey('raw', bits.slice(0, 32), { name: 'AES-CBC' }, false, ['decrypt']);
    return new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-CBC', iv }, ek, ct));
  }

  function show(html) {
    document.open();
    document.write(html);
    document.close();
  }

  (async () => {
    if (!window.crypto || !crypto.subtle) {
      document.body.classList.add('ready');
      err.textContent = 'Bitte die Seite über HTTPS in einem aktuellen Browser öffnen.';
      return;
    }
    let saved = null;
    try { saved = sessionStorage.getItem(KEY); } catch (e) {}
    if (saved) {
      const html = await decrypt(saved).catch(() => null);
      if (html) return show(html);
    }
    document.body.classList.add('ready');
    pw.focus();
  })();

  let busy = false;
  f.addEventListener('submit', async e => {
    e.preventDefault();
    if (busy) return;
    f.classList.remove('bad');
    if (!pw.value) { void f.offsetWidth; f.classList.add('bad'); return; }
    busy = true; err.textContent = ''; f.classList.add('busy');
    const html = await decrypt(pw.value).catch(() => null);
    f.classList.remove('busy');
    if (!html) {
      busy = false; void f.offsetWidth; f.classList.add('bad');
      err.textContent = 'Falsches Passwort – bitte erneut versuchen.';
      pw.select();
      return;

    await wait(950);
